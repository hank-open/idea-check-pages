<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投资学习书架</title>
<meta name="description" content="按依赖关系而非话题热度组织的债券基金与股票投资教科书">
<meta name="theme-color" content="#9a4b2f">
<link rel="manifest" href="/idea-check-pages/manifest.json">
<link rel="icon" href="/idea-check-pages/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/idea-check-pages/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="学习书架">
<style>
  :root{
    --bg:#f7f5f0; --ink:#2a2420; --ink-soft:#5c554d; --ink-faint:#8a8277;
    --rule:#e2dcd0; --accent:#9a4b2f; --accent-soft:#f1e3d9; --gold:#b4882e;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1a1714; --ink:#ece6da; --ink-soft:#bcb2a1; --ink-faint:#80776a; --rule:#39332a; --accent:#e0855a; --accent-soft:#2e2219; --gold:#d9ab4f; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC","PingFang SC",serif;
    display:flex; align-items:center; justify-content:center; padding:32px;
  }
  main{max-width:720px; width:100%}
  .kicker{font-family:"PingFang SC",sans-serif;font-size:12px;letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase;text-align:center}
  h1{font-size:2em;text-align:center;margin:10px 0 6px;letter-spacing:.02em}
  .sub{text-align:center;color:var(--ink-soft);font-size:15px;margin:0 0 40px}
  .shelf{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media (max-width:620px){ .shelf{grid-template-columns:1fr} }
  .card{
    display:block;text-decoration:none;color:var(--ink);
    background:color-mix(in srgb, var(--bg) 92%, var(--ink) 8%);
    border:1px solid var(--rule);border-radius:14px;padding:26px 22px;
    transition:transform .15s,border-color .15s;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .card .badge{
    display:inline-block;font-family:"PingFang SC",sans-serif;font-size:11px;letter-spacing:.08em;
    color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;margin-bottom:12px;
  }
  .card h2{font-size:1.3em;margin:0 0 8px;line-height:1.4}
  .card p{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin:0}
  .card .go{display:block;margin-top:16px;font-family:"PingFang SC",sans-serif;font-size:12.5px;color:var(--gold)}
  footer{text-align:center;margin-top:36px;font-size:12px;color:var(--ink-faint)}
  footer a{color:inherit;text-decoration:underline}
</style>
</head>
<body>
<main>
  <div class="kicker">INVEST · LEARN · OFFLINE</div>
  <h1>投资学习书架</h1>
  <p class="sub">两本按「依赖关系」而非「话题热度」组织的教科书，可安装到桌面 / 主屏幕离线阅读</p>
  <div class="shelf">
    <a class="card" href="book-html/">
      <span class="badge">债券基金</span>
      <h2>从定价引擎到实战盘感</h2>
      <p>一条公式贯穿全书：票息、久期、杠杆、信用、负反馈，从 L0 定价引擎到 L4 实战复盘。</p>
      <span class="go">进入阅读 →</span>
    </a>
    <a class="card" href="stock-book-html/">
      <span class="badge">股票投资</span>
      <h2>从定价引擎到实战盘感</h2>
      <p>两条枢纽、一条公式：股价 = EPS × PE，从会计与估值到驱动归因、选股与组合实战。</p>
      <span class="go">进入阅读 →</span>
    </a>
  </div>
  <footer>可安装为 App（浏览器地址栏或分享菜单里的「添加到主屏幕 / 安装」）· <a href="https://github.com/hank-open/idea-check-pages">源码</a></footer>
</main>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/idea-check-pages/sw.js', { scope: '/idea-check-pages/' });
  }
</script>
</body>
</html>
